# Render Blueprint (free hosting): Dashboard → New → Blueprint → select this repo.
# Creates the API (free web service, Singapore) and the customer and admin websites (free static sites).
# The database is a free Neon Postgres: paste its connection string into DATABASE_URL when asked.
# Free web services sleep after 15 minutes without traffic; the first request then takes ~30–50 s.
services:
  - type: web
    name: rentaltoys-api
    runtime: node
    region: singapore
    plan: free
    branch: main
    # Installs only the API workspace (and @rentaltoys/shared), not the Expo apps.
    buildCommand: npm ci -w @rentaltoys/api --omit=dev
    # Applies pending migrations, ensures plans/warehouse/first admin, then starts the server.
    startCommand: npm run -w @rentaltoys/api start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Neon → your project → Connect → turn OFF "Connection pooling" → copy the postgresql://… string.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # First admin, created automatically on start. Password: 10+ characters.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Optional: comma-separated website addresses allowed to call the API. Empty = allow all.
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: rentaltoys-web
    runtime: static
    branch: main
    buildCommand: npm ci && npm run export:web -w @rentaltoys/customer
    staticPublishPath: apps/customer/dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The API's address, e.g. https://rentaltoys-api.onrender.com (shown on the API's page in Render).
      - key: EXPO_PUBLIC_API_URL
        sync: false
    routes:
      # Single-page app: every path is served by index.html.
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: rentaltoys-admin
    runtime: static
    branch: main
    buildCommand: npm ci && npm run export:web -w @rentaltoys/admin
    staticPublishPath: apps/admin/dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXPO_PUBLIC_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
