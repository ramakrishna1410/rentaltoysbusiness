# Render Blueprint: Dashboard → New → Blueprint → select this repo.
# Creates the API web service and a managed PostgreSQL database in Singapore (closest region to Chennai).
services:
  - type: web
    name: rentaltoys-api
    runtime: node
    region: singapore
    plan: starter
    # Installs only the API workspace (and @rentaltoys/shared), not the Expo apps.
    buildCommand: npm ci -w @rentaltoys/api --omit=dev
    # Applies pending Prisma migrations, then starts the server.
    startCommand: npm run -w @rentaltoys/api start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: rentaltoys-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Comma-separated browser origins allowed to call the API (the website later). Native apps don't need this.
      - key: CORS_ORIGINS
        sync: false
      # First admin, created by `npm run -w @rentaltoys/api db:seed:base` (run once from the Render Shell).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: rentaltoys-db
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: "16"
    databaseName: rentaltoys
    user: rentaltoys
    # No public access; only Render services in this account can connect.
    ipAllowList: []
